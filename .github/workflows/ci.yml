name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter (deliberately, unlike the push trigger above): a PR
  # stacked on another open PR's branch has a base other than main, and a
  # branches filter on pull_request matches against that base -- restricting to
  # [main] would silently give stacked PRs zero CI signal.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Everything, Qt app included. ctest runs the core suite, the purity check
  # (ADR-004), the storage suite, `wl_fmt --check` over data/, and the app's
  # model and widget tests offscreen.
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, asan]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build qt6-base-dev qt6-svg-dev libgl1-mesa-dev nlohmann-json3-dev
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}
