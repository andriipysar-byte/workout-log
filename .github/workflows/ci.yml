name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter (deliberately, unlike the push trigger above): a PR
  # stacked on another open PR's branch has a base other than main, and a
  # branches filter on pull_request matches against that base -- restricting to
  # [main] would silently give stacked PRs zero CI signal.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The core and the MCP server need no system libraries, so they are the cheap
  # job: everything that can fail without a desktop toolchain fails here first.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy -p workout-log-core -p workout-log-mcp --all-targets -- -D warnings

      # The suites read the real data/, exercises.json and cycles.json -- a
      # fixture copy would only test the copy. Nothing writes outside a tempdir.
      - run: cargo test -p workout-log-core -p workout-log-mcp

      # data/ is kept canonical on disk, so a hand-edit the encoder would rewrite
      # fails here rather than showing up as noise in someone's next diff.
      - name: wl_fmt --check
        run: cargo run --quiet --bin wl_fmt -- --check

  # Dioxus desktop is a WebKitGTK webview, so the app is the only target that
  # needs system libraries -- and the only one that proves the bundle links.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/workout-log-app/package-lock.json

      # assets/tailwind.css is generated from the classes in the Rust source and
      # committed so a plain `cargo build` needs no Node. Regenerating it here is
      # the drift guard, and it runs before the slow steps so it fails fast.
      - name: Stylesheet in sync
        working-directory: crates/workout-log-app
        run: |
          npm ci
          npx @tailwindcss/cli -i tailwind.css -o /tmp/tailwind.css --minify
          diff -u assets/tailwind.css /tmp/tailwind.css \
            || { echo '::error::run: npx @tailwindcss/cli -i tailwind.css -o assets/tailwind.css --minify'; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - run: cargo clippy -p workout-log-app --all-targets -- -D warnings
      - run: cargo build -p workout-log-app --release

      # The browser build is the ADR-007 working-copy target, and it catches
      # anything that quietly grew a dependency on the filesystem.
      - name: Web target
        run: cargo check -p workout-log-app --no-default-features --features web --target wasm32-unknown-unknown
