name: CI

on:
  push:
    branches: [main]
  # No `branches:` filter (deliberately, unlike the push trigger above): a PR
  # stacked on another open PR's branch has a base other than main, and a
  # branches filter on pull_request matches against that base -- restricting to
  # [main] would silently give stacked PRs zero CI signal.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job runs on the self-hosted runners that ci/runner/ builds, whose image
# already carries the toolchain. The repository is public, so a pull request
# from a fork never reaches that machine: its jobs are skipped instead.

jobs:
  build:
    name: build (${{ matrix.compiler }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, workout-log]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: clang, preset: dev }
          - { compiler: gcc, preset: gcc }
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset ${{ matrix.preset }} -DWL_WERROR=ON
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  # tsan leaves the Qt app out: the distribution's Qt is not instrumented, so
  # its threads would be reported as races in code this project does not own.
  sanitize:
    name: sanitize (${{ matrix.preset }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, workout-log]
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset ${{ matrix.preset }} -DWL_WERROR=ON
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }}

  tidy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, workout-log]
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset dev
      - run: cmake --build --preset dev
      - run: ci/tidy.sh build/dev
